databases:
  - name: shydevs-db
    plan: free
    databaseName: shydevs
    user: shydevs

services:
  - type: web
    name: shydevs-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: shydevs-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.5"
